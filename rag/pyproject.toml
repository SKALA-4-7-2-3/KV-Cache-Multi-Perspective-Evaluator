[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kv-cache-technical-research-agent"
version = "0.1.0"
description = "Evidence-grounded multi-paper technical research agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chromadb>=1.0,<2",
  "flagembedding==1.4.2",
  "huggingface-hub>=0.34,<1",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "numpy>=2.0,<3",
  "openai>=2.0,<3",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pymupdf>=1.25,<2",
  "tenacity>=9.0,<10",
  "torch>=2.6,<3",
  "transformers>=4.48,<5",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6.0,<8"]

[project.scripts]
paper-review = "paper_review_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_review_agent"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
