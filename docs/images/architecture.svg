<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title description">
  <title id="title">KV Cache Multi-Perspective Evaluator 아키텍처</title>
  <desc id="description">논문 PDF와 사용자 요청을 RAG에 전달하고, 같은 자료를 도메인, 이해관계자, 시장 에이전트가 순차적으로 평가합니다. Review Agent가 결과를 종합한 뒤 Report Agent가 보고서 PDF를 생성합니다. 기본 RAG 모드는 저장된 분석 결과 재사용입니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; text-anchor: middle; }
      .heading { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .label { font-size: 23px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 19px; fill: #475569; }
      .note { font-size: 18px; fill: #475569; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #64748b; stroke-width: 2.5; }
      .box { stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="980" rx="24" fill="#f8fafc"/>
  <text class="heading" x="600" y="51">KV Cache Multi-Perspective Evaluator</text>
  <text class="body" x="600" y="82">6개 에이전트: 기술 조사부터 다중 관점 평가·종합·보고서 생성까지</text>
  <rect class="box" x="335" y="111" width="530" height="86" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="label" x="600" y="145">논문 PDF + 사용자 요청</text>
  <text class="body" x="600" y="176">RDKV · Photonic-CXL / 평가 목적·도메인</text>
  <path class="flow" d="M 600 197 V 231"/>
  <rect class="box" x="290" y="233" width="620" height="111" rx="16" fill="#eef2ff" stroke="#a5b4fc"/>
  <text class="label" x="600" y="266">Technical Research Agent · RAG</text>
  <text class="body" x="600" y="297">기술 개요·실험 조건·한계·원문 근거</text>
  <text class="note" x="600" y="324">기본: 저장 결과 재사용 / --run-rag: PDF 새 분석</text>
  <path class="bus" d="M 600 344 V 381 M 220 381 H 980"/>
  <path class="flow" d="M 220 381 V 424"/>
  <path class="flow" d="M 600 381 V 424"/>
  <path class="flow" d="M 980 381 V 424"/>
  <rect x="388" y="391" width="424" height="26" rx="8" fill="#f8fafc"/>
  <text class="note" x="600" y="410">공통 논문 근거와 요청을 각 관점에 전달</text>
  <rect class="box" x="65" y="428" width="310" height="116" rx="16" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="label" x="220" y="464">① Domain Agent</text>
  <text class="body" x="220" y="496">도메인 요구·적합성</text>
  <text class="note" x="220" y="525">논문 근거 기반 평가</text>
  <rect class="box" x="445" y="428" width="310" height="116" rx="16" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="label" x="600" y="464">② Stakeholder Agent</text>
  <text class="body" x="600" y="496">이익·부담·도입 조건</text>
  <text class="note" x="600" y="525">Tavily 웹 자료 보강</text>
  <rect class="box" x="825" y="428" width="310" height="116" rx="16" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="label" x="980" y="464">③ Market Agent</text>
  <text class="body" x="980" y="496">시장·제품·생태계</text>
  <text class="note" x="980" y="525">Tavily 웹 자료 보강</text>
  <path class="bus" d="M 220 544 V 580 H 980 V 544 M 600 544 V 580"/>
  <path class="flow" d="M 600 580 V 622"/>
  <text class="note" x="902" y="608">실제 실행: ① → ② → ③ 순차 호출</text>
  <rect class="box" x="335" y="625" width="530" height="86" rx="16" fill="#fff7ed" stroke="#fdba74"/>
  <text class="label" x="600" y="660">Review Agent</text>
  <text class="body" x="600" y="691">세 관점 종합·TRL·의미 검사·검토 사항</text>
  <path class="flow" d="M 600 711 V 744"/>
  <rect class="box" x="335" y="747" width="530" height="86" rx="16" fill="#eef2ff" stroke="#a5b4fc"/>
  <text class="label" x="600" y="782">Report Agent</text>
  <text class="body" x="600" y="813">한국어 보고서 작성·인용 연결·PDF 변환</text>
  <path class="flow" d="M 600 833 V 866"/>
  <rect class="box" x="335" y="869" width="530" height="67" rx="16" fill="#0f172a" stroke="#0f172a"/>
  <text x="600" y="911" font-size="23" font-weight="700" fill="#ffffff">평가 JSON · 종합 Markdown · LaTeX · PDF</text>
  <text class="note" x="600" y="965">단계별 입력·출력·실행 상태는 outputs/에 저장</text>
</svg>
