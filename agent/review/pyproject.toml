[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-cache-multi-view-evaluator"
version = "0.1.0"
description = "KV cache multi-view evaluation: review and synthesis agent"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
review-graph = ["langgraph>=1,<2"]
review-papers = ["pypdf>=6,<7"]
review-llm = ["openai>=2,<4", "python-dotenv>=1,<2"]

[project.scripts]
team-review = "team_review.__main__:main"

[tool.setuptools]
packages = ["team_review", "team_review.examples"]

[tool.setuptools.package-data]
team_review = ["*.md", "examples/*.md"]
