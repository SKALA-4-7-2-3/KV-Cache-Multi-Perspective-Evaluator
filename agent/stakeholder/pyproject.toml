[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kv-stakeholder-agent"
version = "0.2.0"
description = "JSON-in/JSON-out LangGraph stakeholder research agent for two paper analyses"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "langgraph>=1.0.9,<2",
  "langchain-openai>=1.0.1,<2",
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.14,<5",
  "python-dotenv>=1.2,<2",
  "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
stakeholder-agent = "stakeholder_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["stakeholder_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
